version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql-poneglyph
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-poneglyph_db}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - poneglyph-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./back/poneglyph-api
      dockerfile: Dockerfile
    container_name: spring-poneglyph-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/${DB_NAME:-poneglyph_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${DB_ROOT_PASSWORD:-root}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - poneglyph-net

  frontend:
    build:
      context: ./front/frontend
      dockerfile: Dockerfile
    container_name: react-poneglyph-ui
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - poneglyph-net

volumes:
  mysql_data:

networks:
  poneglyph-net:
    driver: bridge