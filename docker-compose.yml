services:
  db:
    image: mysql:8.0
    container_name: mysql-poneglyph
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - poneglyph-net

  backend:
    build:
      context: ./back/poneglyph-api
      dockerfile: Dockerfile
    container_name: spring-poneglyph-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/${DB_NAME}?useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${DB_ROOT_PASSWORD}
    depends_on:
      - db
    networks:
      - poneglyph-net

  frontend:
    build:
      context: ./front/frontend
      dockerfile: Dockerfile
    container_name: react-poneglyph-ui
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - poneglyph-net

volumes:
  mysql_data:

networks:
  poneglyph-net:
    driver: bridge